<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
</head>

<body style="
    margin:0; 
    padding:0; 
    background-color:#f4f4f4; 
    font-family: Arial, Helvetica, sans-serif;
">

  <!-- Preheader (hidden preview text) -->
    <div style="
        display:none; 
        max-height:0; 
        overflow:hidden; 
        opacity:0;
    ">
        {{ preheader }}
    </div>

    <!-- Outer wrapper -->
    <table 
        role="presentation" 
        width="100%" 
        cellpadding="0" 
        cellspacing="0" 
        border="0" 
        style="
            background-color:#f4f4f4; 
            padding:40px 0;
    ">

        <tr>
            <td align="center">

                <!-- Main container -->
                <table 
                    role="presentation" 
                    width="600" 
                    cellpadding="0" 
                    cellspacing="0" 
                    border="0" 
                    style="
                        max-width:600px; 
                        width:100%; 
                        background-color:#dcdcdc; 
                        border-radius:8px; 
                        overflow:hidden;
                ">

                    <!-- ===== HEADER ===== -->
                    <tr>
                        <td style="
                            background-color:#1a110a; 
                            padding:24px 32px;
                        ">
                            <table 
                                role="presentation" 
                                width="100%" 
                                cellpadding="0" 
                                cellspacing="0" 
                                border="0"
                            >
                            <tr>
                                
                                <!-- Logo -->
                                <td 
                                    width="70" 
                                    valign="middle"
                                >
                                    <div>
                                        <img 
                                            src="cid:company-logo" 
                                            alt="{{ company_name }} Logo"
                                            style="
                                                width: 70px; 
                                                height: 70px;
                                        "/>
                                    </div>
                                </td>

                                <!-- Company name + address -->
                                <td 
                                    valign="middle" 
                                    style="padding-left:16px;"
                                >
                                    <div style="
                                        color:#ffffff; 
                                        font-size:18px; 
                                        font-weight:bold; 
                                        line-height:1.3;
                                    ">
                                        {{ company_name }}
                                    </div>

                                    <div style="
                                        color:#b8b0a8; 
                                        font-size:13px; 
                                        line-height:1.5;
                                    ">
                                        {{ address }}
                                    </div>
                                </td>
                            </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- ===== BODY ===== -->
                    <tr>
                        <td style="
                            background: color #eeeeee;; 
                            padding:40px 40px 30px 40px;
                        ">

                            <table 
                                role="presentation" 
                                width="100%" 
                                cellpadding="0" 
                                cellspacing="0" 
                                border="0"
                            >

                                <!-- Greeting -->
                                <tr>
                                    <td style="
                                        color:#1a110a; 
                                        font-size:16px; 
                                        padding-bottom:12px;
                                    ">
                                        Hi <strong>{{ first_name }} {{ last_name }}</strong>,
                                    </td>
                                </tr>

                                <!-- Intro text -->
                                <tr>
                                    <td style="
                                        color:#251b17; 
                                        font-size:15px; 
                                        line-height:1.6; 
                                        padding-bottom:28px;
                                    ">
                                        {{ first_intro }}
                                    </td>
                                </tr>

                                <tr>
                                    <td style="
                                        color:#251b17; 
                                        font-size:15px; 
                                        line-height:1.6; 
                                        padding-bottom:28px;
                                    ">                          
                                        {{ second_intro }}
                                    </td>
                                </tr>

                                <!-- Button -->
                                <tr>
                                    <td style="padding-bottom:32px;">
                                        <table 
                                            role="presentation" 
                                            cellpadding="0" 
                                            cellspacing="0" 
                                            border="0"
                                        >
                                            <tr>
                                                <td style="
                                                    background-color:#1a110a; 
                                                    border-radius:6px;
                                                ">
                                                    <a 
                                                        href="{{ invite_link }}" 
                                                        target="_blank"
                                                        style="
                                                            display:inline-block; 
                                                            padding:14px 28px; 
                                                            color:#ffffff; 
                                                            font-size:14px; 
                                                            font-weight:bold; 
                                                            text-decoration:none; 
                                                            letter-spacing:1px; 
                                                            border-radius:6px;
                                                    ">
                                                        {{ button }}
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Bold text -->
                                <tr>
                                    <td style="
                                        color:#1a110a; 
                                        font-size:15px; 
                                        font-weight:bold; 
                                        padding-bottom:10px;
                                    ">
                                        {{ exp_notice }}
                                    </td>
                                </tr>

                                <!-- Regular text -->
                                <tr>
                                    <td style="
                                        color:#251b17; 
                                        font-size:15px; 
                                        line-height:1.6; 
                                        padding-bottom:32px;
                                    ">                               
                                        {{ ending }}
                                    </td>
                                </tr>

                                <!-- Sign off -->
                                <tr>
                                    <td style="
                                        color:#251b17; 
                                        font-size:15px; 
                                        line-height:1.6;
                                    ">
                                        {{ regards }}<br>
                                        <strong style="color:#1a110a;">{{ team }}</strong>
                                    </td>
                                </tr>

                            </table>
                        </td>
                    </tr>

                    <!-- ===== FOOTER ===== -->
                    <tr>
                        <td style="
                            background-color:#1a110a; 
                            padding:24px 40px;
                        ">
                            <div style="
                                color:#ffffff; 
                                font-size:13px; 
                                line-height:1.6;
                            ">
                                {{ footer_text }}
                                <a 
                                    href="mailto:company@gmail.com" 
                                    style="color:#ffffff; 
                                    text-decoration:underline;
                                ">
                                    {{ footer_link }}
                                </a>.
                            </div>
                        </td>
                    </tr>
            </table>
            <!-- /Main container -->

        </td>
    </tr>
    </table>

</body>
</html>
