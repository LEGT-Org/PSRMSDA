[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.14.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.53.0",
]

# Development Configuration
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Test Configuration
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
